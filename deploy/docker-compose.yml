services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: behoosh
      POSTGRES_PASSWORD: behoosh
      POSTGRES_DB: behoosh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U behoosh"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file: ../.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: python -m app.mcp.server
    env_file: ../.env
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
