<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود — بهوش</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3E%D8%A8%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>بهوش</h1>
    <p>پلتفرم سلامت و مالی شخصی</p>
  </div>

  <div class="card">
    <div class="msg" id="msg"></div>
    <form id="f" autocomplete="on">
      <label for="email">ایمیل</label>
      <input id="email" type="email" name="email" required autocomplete="username" dir="ltr">
      <label for="password">رمز عبور</label>
      <input id="password" type="password" name="password" required autocomplete="current-password" dir="ltr">
      <button id="go" type="submit">ورود</button>
    </form>
  </div>

  <div class="foot">با ورود، توکن دسترسی فقط در همین مرورگر ذخیره می‌شود.</div>
</div>

<script src="config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
